name: Publish images
# Prebuilt images on GitHub Container Registry, for the README quick start (no 15–25 minute local
# build) and for executor VMs (HBE_EXECUTOR_IMAGE in deploy/oci/install-executor.sh).
#   ghcr.io/<owner>/hbecode-{api,web,executor}:<git-sha> and :<branch>   (linux/amd64 + linux/arm64)
# Each architecture is built natively (no emulation), then joined into one multi-arch tag.
# The web image is built for http://localhost:4000 (local use); production web builds come from
# render.yaml / CloudFront with the real API URL.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  PREFIX: ghcr.io/${{ github.repository_owner }}/hbecode

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        image: [api, web, executor]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    name: ${{ matrix.image }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.image }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.PREFIX }}-${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch tags
        run: |
          ref=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9_.-')
          for img in api web executor; do
            docker buildx imagetools create -t "$PREFIX-$img:$GITHUB_SHA" -t "$PREFIX-$img:$ref" \
              "$PREFIX-$img:$GITHUB_SHA-amd64" "$PREFIX-$img:$GITHUB_SHA-arm64"
          done
          { echo "### Published"; for img in api web executor; do echo "- \`$PREFIX-$img:$ref\` (and \`:$GITHUB_SHA\`)"; done; } >> "$GITHUB_STEP_SUMMARY"
