name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hbe/shared build && pnpm --filter @hbe/web-runtime build && pnpm --filter @hbe/db build && pnpm --filter @hbe/question-format build
      - run: pnpm lint
      - name: Dependency audit (production dependencies, moderate and above)
        run: pnpm audit --prod --audit-level=moderate
      # The API tests import its compiled output (dist), so build before typechecking them.
      - run: pnpm --filter @hbe/api build && pnpm --filter @hbe/api exec tsc -p tsconfig.json --noEmit
      - run: pnpm --filter @hbe/executor typecheck
      - run: pnpm --filter @hbe/shared test
      - run: pnpm --filter @hbe/web-runtime test
      - run: pnpm --filter @hbe/question-format test
      - run: pnpm --filter @hbe/executor test
      - name: Web build (static export + CSP)
        run: pnpm --filter @hbe/web build

  integration:
    name: RLS + API integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Non-superuser owner role (mirrors Supabase)
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE ROLE hbe_owner LOGIN CREATEROLE CREATEDB PASSWORD 'hbe_owner'"
      - run: pnpm --filter @hbe/shared build && pnpm --filter @hbe/db build && pnpm --filter @hbe/question-format build && pnpm --filter @hbe/api build
      - run: pnpm --filter @hbe/db test
      - run: pnpm --filter @hbe/api test

  sandbox:
    name: Executor image + sandbox escape suite
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/executor/Dockerfile
          tags: hbe-executor:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hbe-executor:dev
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0' # report only until the baseline is triaged
      - run: pnpm --filter @hbe/shared build && pnpm --filter @hbe/web-runtime build && pnpm --filter @hbe/db build && pnpm --filter @hbe/question-format build && pnpm --filter @hbe/api build
      # Also starts throwaway PostgreSQL/MySQL/MongoDB runner containers for the DB suite.
      - name: Sandbox tests (8 languages, escape attempts, web grader, DB runners)
        run: pnpm --filter @hbe/executor test:sandbox
      - name: API + real executor end-to-end (coding, web and DB questions; latency report)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE ROLE hbe_owner LOGIN CREATEROLE CREATEDB PASSWORD 'hbe_owner'"
          pnpm --filter @hbe/api test:e2e
          { echo '### Coding latency (ms)'; echo '```json'; cat /tmp/hbe-e2e-latency.json; echo '```'; echo '### Web/DB latency (ms)'; echo '```json'; cat /tmp/hbe-e2e-webdb-latency.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  sandbox-arm64:
    # Oracle A1 (the pilot executor) is ARM64: build the image natively and run the escape suite there.
    name: Sandbox escape suite (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build executor image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/executor/Dockerfile
          tags: hbe-executor:dev
          load: true
          cache-from: type=gha,scope=executor-arm64
          cache-to: type=gha,mode=max,scope=executor-arm64
      - run: pnpm --filter @hbe/shared build && pnpm --filter @hbe/web-runtime build
      - name: Sandbox tests (8 languages, escape attempts, web grader, DB runners)
        run: pnpm --filter @hbe/executor test:sandbox

  images:
    name: API and web images (build + Trivy, fail on fixable HIGH/CRITICAL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, tags: 'hbe-api:ci', load: true, cache-from: type=gha, cache-to: 'type=gha,mode=max,scope=api' }
      - name: Build web image
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, tags: 'hbe-web:ci', load: true, cache-from: type=gha, cache-to: 'type=gha,mode=max,scope=web' }
      - name: Images run as non-root with no shell
        run: |
          for i in hbe-api:ci hbe-web:ci; do
            test "$(docker image inspect -f '{{.Config.User}}' "$i")" = "65532:65532"
            ! docker run --rm --entrypoint /bin/sh "$i" -c true 2>/dev/null
          done
      - name: Trivy (API)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: 'hbe-api:ci', severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }
      - name: Trivy (web)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: 'hbe-web:ci', severity: 'HIGH,CRITICAL', ignore-unfixed: true, exit-code: '1' }

  seed-bank:
    name: Seed bank (every question through the validator)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build executor image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/executor/Dockerfile
          tags: hbe-executor:dev
          load: true
          cache-from: type=gha
      - run: pnpm --filter @hbe/shared build && pnpm --filter @hbe/web-runtime build && pnpm --filter @hbe/db build && pnpm --filter @hbe/question-format build && pnpm --filter @hbe/api build
      - name: Structural checks (17 stacks × 10, publish rules)
        run: pnpm --filter @hbe/db exec vitest run test/bank.test.ts
      - name: Validate every seed question in the real sandbox
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE ROLE hbe_owner LOGIN CREATEROLE CREATEDB PASSWORD 'hbe_owner'"
          BANK_SLOTS=4 pnpm --filter @hbe/api test:bank
      - name: Report
        if: always()
        run: |
          [ -f /tmp/hbe-seed-bank.json ] || exit 0
          node -e '
            const d = require("/tmp/hbe-seed-bank.json");
            const lines = [`### Seed bank: ${d.published}/${d.total} published (${d.minutes} min)`, "", "| Stack | Question | Status | Problems |", "|---|---|---|---|"];
            for (const r of d.results) lines.push(`| ${r.stack} | ${r.title} | ${r.status} | ${r.problems.join("; ").replace(/\|/g, "\\|")} |`);
            console.log(lines.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.16.5 }
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate (no credentials, no backend)
        run: |
          for d in infra/terraform/oci-executor infra/terraform/aws/envs/prod; do
            echo "::group::$d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            echo "::endgroup::"
          done
      - name: Shell scripts parse
        run: for f in deploy/oci/install-executor.sh loadtest/run.sh scripts/refresh-image-digests.sh; do bash -n "$f"; done

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
