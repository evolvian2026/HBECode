# Local development stack: Postgres, Redis, migrations, API, executor (sandbox), web.
#   cp .env.example .env    (optional: change passwords)
#   docker compose up --build
#   docker compose run --rm seed     (creates the admin/demo accounts and queues seed questions)
# Web: http://localhost:3000   API: http://localhost:4000
#
# Ports are bound to 127.0.0.1 only (PG_HOST_PORT / REDIS_HOST_PORT change the host side if 5432/6379 are taken). The executor needs extra privileges to build sandboxes
# (see docs/deployment.md#executor); every submission still runs as uid 65534 inside nsjail.
name: hbecode

x-build: &build
  context: .
  secrets: [extra_ca]

# Node services: read-only root filesystem, no Linux capabilities, no privilege escalation,
# bounded memory and processes. The API gets the same 512 MB as the pilot's Render instance.
x-hardened: &hardened
  read_only: true
  tmpfs: ['/tmp:size=64m']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  pids_limit: 256

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: hbe_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hbe_owner_dev}
      POSTGRES_DB: hbe
    ports: ['127.0.0.1:${PG_HOST_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hbe_owner -d hbe']
      interval: 2s
      retries: 30

  redis:
    image: mirror.gcr.io/library/redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ['redis-server', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 30

  migrate:
    build: { <<: *build, dockerfile: apps/api/Dockerfile }
    image: ${HBE_IMAGE_PREFIX:-hbe-}api:${HBE_TAG:-dev}
    <<: *hardened
    command: ['node', 'node_modules/@hbe/db/dist/cli/migrate.js']
    environment:
      DATABASE_ADMIN_URL: postgres://hbe_owner:${POSTGRES_PASSWORD:-hbe_owner_dev}@postgres:5432/hbe
      HBE_APP_DB_PASSWORD: ${HBE_APP_DB_PASSWORD:-hbe_app_dev_password}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ${HBE_IMAGE_PREFIX:-hbe-}api:${HBE_TAG:-dev}
    <<: *hardened
    mem_limit: 512m
    restart: unless-stopped
    environment: &api-env
      NODE_ENV: development
      DATABASE_URL: postgres://hbe_app:${HBE_APP_DB_PASSWORD:-hbe_app_dev_password}@postgres:5432/hbe
      REDIS_URL: redis://redis:6379
      WEB_ORIGINS: http://localhost:3000
      WEB_URL: http://localhost:3000
      EXECUTOR_TOKENS: ${EXECUTOR_TOKEN:-dev-executor-token-change-me-0123456789}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      LOG_LEVEL: info
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  seed:
    image: ${HBE_IMAGE_PREFIX:-hbe-}api:${HBE_TAG:-dev}
    <<: *hardened
    profiles: [tools]
    command: ['node', 'dist/cli/seed.js']
    environment:
      <<: *api-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hbecode.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-password-dev-1}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-password-123}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Database runners for DB questions: reachable only from the executor (internal network, no
  # published ports), data on tmpfs (nothing persists), hardened server flags. Student queries
  # run as per-run users/databases created and dropped by the executor.
  runner-pg:
    image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: runner_admin
      POSTGRES_PASSWORD: ${RUNNER_PG_PASSWORD:-runner-pg-dev}
    tmpfs: [/var/lib/postgresql/data]
    restart: unless-stopped
    networks: [runners]
    mem_limit: 512m
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U runner_admin']
      interval: 2s
      retries: 60

  runner-mysql:
    image: mirror.gcr.io/library/mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    command: ['--local-infile=0', '--secure-file-priv=NULL', '--skip-name-resolve', '--performance-schema=0', '--innodb-buffer-pool-size=64M', '--max-connections=100']
    environment:
      MYSQL_ROOT_PASSWORD: ${RUNNER_MYSQL_PASSWORD:-runner-mysql-dev}
    tmpfs: [/var/lib/mysql]
    restart: unless-stopped
    networks: [runners]
    mem_limit: 768m
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 3s
      retries: 60

  runner-mongo:
    image: mirror.gcr.io/library/mongo:8.0@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c
    command: ['--noscripting', '--wiredTigerCacheSizeGB', '0.25']
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${RUNNER_MONGO_PASSWORD:-runner-mongo-dev}
    tmpfs: [/data/db]
    restart: unless-stopped
    networks: [runners]
    mem_limit: 768m # mongod + tmpfs data + the mongosh health check (~150 MB each run)
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ping:1})']
      interval: 3s
      retries: 60

  executor:
    build: { <<: *build, dockerfile: apps/executor/Dockerfile }
    image: ${HBE_IMAGE_PREFIX:-hbe-}executor:${HBE_TAG:-dev}
    environment:
      EXECUTOR_API_URL: http://api:4000
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-dev-executor-token-change-me-0123456789}
      EXECUTOR_ID: local-1
      EXECUTOR_SLOTS: 2
      PG_RUNNER_URL: postgres://runner_admin:${RUNNER_PG_PASSWORD:-runner-pg-dev}@runner-pg:5432/postgres
      MYSQL_RUNNER_URL: mysql://root:${RUNNER_MYSQL_PASSWORD:-runner-mysql-dev}@runner-mysql:3306
      MONGO_RUNNER_URL: mongodb://root:${RUNNER_MONGO_PASSWORD:-runner-mongo-dev}@runner-mongo:27017/?authSource=admin
    networks: [default, runners]
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: ['seccomp=unconfined', 'apparmor=unconfined', 'systempaths=unconfined']
    cgroup: private
    # Read-only image; job directories live on tmpfs (exec allowed: compiled programs run from there).
    read_only: true
    tmpfs: ['/var/lib/hbe-exec:exec,size=2g,mode=0711', '/tmp:size=256m']
    depends_on:
      api: { condition: service_started }
      runner-pg: { condition: service_healthy }
      runner-mysql: { condition: service_healthy }
      runner-mongo: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      <<: *build
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_API_URL: 'http://localhost:4000' }
    image: ${HBE_IMAGE_PREFIX:-hbe-}web:${HBE_TAG:-dev}
    <<: *hardened
    mem_limit: 256m
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']

secrets:
  # Only needed behind a TLS-intercepting proxy; an empty file is ignored.
  extra_ca:
    file: ${EXTRA_CA_FILE:-./.empty-ca}

networks:
  default: {}
  # No route out: runners can talk to the executor and nothing else.
  runners: { internal: true }

volumes:
  pgdata:
